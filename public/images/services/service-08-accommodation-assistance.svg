<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">

  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05134A"/>
      <stop offset="55%" stop-color="#0A266E"/>
      <stop offset="100%" stop-color="#113896"/>
    </linearGradient>
    <linearGradient id="bgCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B68"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgCrimson)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="240" r="260" fill="url(#glowGold)"/>
  <circle cx="720" cy="70" r="140" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="80" cy="440" r="180" fill="#FFFFFF" fill-opacity="0.03"/>
  
    <!-- Modern Student Residence Buildings -->
    <g transform="translate(150, 95)" filter="url(#shadow)">
      <rect x="0" y="65" width="145" height="245" rx="14" fill="#1E293B" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <rect x="22" y="95" width="38" height="32" rx="6" fill="#FDE68A"/>
      <rect x="82" y="95" width="38" height="32" rx="6" fill="#93C5FD"/>
      <rect x="22" y="148" width="38" height="32" rx="6" fill="#93C5FD"/>
      <rect x="82" y="148" width="38" height="32" rx="6" fill="#FDE68A"/>
      <rect x="22" y="201" width="38" height="32" rx="6" fill="#FDE68A"/>
      <rect x="82" y="201" width="38" height="32" rx="6" fill="#93C5FD"/>

      <rect x="165" y="15" width="175" height="295" rx="18" fill="#FFFFFF"/>
      <rect x="165" y="15" width="175" height="46" rx="18" fill="#071B68"/>
      <text x="252" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">CAMPUS RESIDENCE</text>
      <rect x="192" y="84" width="50" height="40" rx="8" fill="#DBEAFE"/>
      <rect x="262" y="84" width="50" height="40" rx="8" fill="#FEF3C7"/>
      <rect x="192" y="142" width="50" height="40" rx="8" fill="#FEF3C7"/>
      <rect x="262" y="142" width="50" height="40" rx="8" fill="#DBEAFE"/>
      <rect x="224" y="228" width="56" height="82" rx="10" fill="#071B68"/>
    </g>
    <!-- Golden Key Badge -->
    <g transform="translate(590, 235)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="68" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="-18" cy="0" r="18" fill="none" stroke="#071B68" stroke-width="7"/>
      <path d="M 0 0 L 38 0 M 24 0 L 24 14 M 36 0 L 36 14" stroke="#071B68" stroke-width="7" stroke-linecap="round"/>
    </g>
    
  <!-- Subtle Corner Crest -->
  <g transform="translate(36, 32)">
    <rect width="128" height="32" rx="16" fill="#020617" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <circle cx="18" cy="16" r="6" fill="url(#redGrad)"/>
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">SERVICE 08</text>
  </g>
  <g transform="translate(36, 444)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" fill-opacity="0.75" letter-spacing="2.5">IQ OVERSEAS • ACCOMMODATION ASSISTANCE</text>
  </g>
</svg>
