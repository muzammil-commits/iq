<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">

  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05134A"/>
      <stop offset="55%" stop-color="#0A266E"/>
      <stop offset="100%" stop-color="#113896"/>
    </linearGradient>
    <linearGradient id="bgCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B68"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgNavy)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="250" r="260" fill="url(#glowGold)"/>
  <circle cx="720" cy="70" r="140" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="80" cy="440" r="180" fill="#FFFFFF" fill-opacity="0.03"/>
  
    <!-- Scholarship & Funding Dashboard Card -->
    <g transform="translate(140, 105)" filter="url(#shadow)">
      <rect width="360" height="280" rx="24" fill="#FFFFFF"/>
      <text x="28" y="44" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#071B68">SCHOLARSHIP &amp; PROOF OF FUNDS</text>
      <!-- Rising Bars -->
      <rect x="36" y="175" width="44" height="68" rx="10" fill="#CBD5E1"/>
      <rect x="98" y="145" width="44" height="98" rx="10" fill="#60A5FA"/>
      <rect x="160" y="110" width="44" height="133" rx="10" fill="#071B68"/>
      <rect x="222" y="75" width="44" height="168" rx="10" fill="url(#goldGrad)"/>
      <rect x="284" y="95" width="44" height="148" rx="10" fill="url(#emeraldGrad)"/>
      <line x1="28" y1="245" x2="332" y2="245" stroke="#E2E8F0" stroke-width="3"/>
    </g>
    <!-- Gold Scholarship Crest -->
    <g transform="translate(575, 225)" filter="url(#shadow)">
      <polygon points="-32,55 0,130 32,55" fill="url(#redGrad)"/>
      <circle cx="0" cy="0" r="82" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="5"/>
      <circle cx="0" cy="0" r="64" fill="#071B68"/>
      <text x="0" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#FDE68A">$</text>
    </g>
    
  <!-- Subtle Corner Crest -->
  <g transform="translate(36, 32)">
    <rect width="128" height="32" rx="16" fill="#020617" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <circle cx="18" cy="16" r="6" fill="url(#redGrad)"/>
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">SERVICE 04</text>
  </g>
  <g transform="translate(36, 444)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" fill-opacity="0.75" letter-spacing="2.5">IQ OVERSEAS • FINANCIAL ASSISTANCE</text>
  </g>
</svg>
