<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">

  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05134A"/>
      <stop offset="55%" stop-color="#0A266E"/>
      <stop offset="100%" stop-color="#113896"/>
    </linearGradient>
    <linearGradient id="bgCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B68"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgNavy)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="250" r="260" fill="url(#glowRed)"/>
  <circle cx="720" cy="70" r="140" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="80" cy="440" r="180" fill="#FFFFFF" fill-opacity="0.03"/>
  
    <!-- Back Document -->
    <g transform="translate(210, 95) rotate(-6)" filter="url(#shadow)">
      <rect width="260" height="310" rx="20" fill="#E2E8F0"/>
      <rect x="28" y="36" width="140" height="14" rx="7" fill="#94A3B8"/>
      <rect x="28" y="68" width="200" height="10" rx="5" fill="#CBD5E1"/>
      <rect x="28" y="92" width="180" height="10" rx="5" fill="#CBD5E1"/>
    </g>
    <!-- Front Main Application Dossier -->
    <g transform="translate(275, 85)" filter="url(#shadow)">
      <rect width="270" height="325" rx="22" fill="#FFFFFF"/>
      <rect x="0" y="0" width="270" height="64" rx="22" fill="#071B68"/>
      <rect x="0" y="40" width="270" height="24" fill="#071B68"/>
      <text x="24" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">SOP &amp; ADMISSION FILE</text>
      <rect x="24" y="88" width="222" height="12" rx="6" fill="#1E293B"/>
      <rect x="24" y="114" width="190" height="10" rx="5" fill="#94A3B8"/>
      <rect x="24" y="136" width="210" height="10" rx="5" fill="#94A3B8"/>
      <rect x="24" y="158" width="160" height="10" rx="5" fill="#94A3B8"/>
      <!-- Checklist Rows -->
      <circle cx="36" cy="204" r="10" fill="url(#emeraldGrad)"/>
      <path d="M 31 204 L 35 208 L 42 200" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="58" y="198" width="160" height="12" rx="6" fill="#071B68" fill-opacity="0.8"/>
      <circle cx="36" cy="238" r="10" fill="url(#emeraldGrad)"/>
      <path d="M 31 238 L 35 242 L 42 234" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="58" y="232" width="140" height="12" rx="6" fill="#071B68" fill-opacity="0.8"/>
      <circle cx="36" cy="272" r="10" fill="url(#emeraldGrad)"/>
      <path d="M 31 272 L 35 276 L 42 268" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="58" y="266" width="175" height="12" rx="6" fill="#071B68" fill-opacity="0.8"/>
    </g>
    <!-- Gold Seal -->
    <g transform="translate(545, 325)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="46" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 3"/>
      <path d="M -12 0 L -3 10 L 15 -10" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
  <!-- Subtle Corner Crest -->
  <g transform="translate(36, 32)">
    <rect width="128" height="32" rx="16" fill="#020617" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <circle cx="18" cy="16" r="6" fill="url(#redGrad)"/>
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">SERVICE 02</text>
  </g>
  <g transform="translate(36, 444)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" fill-opacity="0.75" letter-spacing="2.5">IQ OVERSEAS • APPLICATION PROCESS</text>
  </g>
</svg>
