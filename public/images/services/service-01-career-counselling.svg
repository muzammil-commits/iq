<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">

  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05134A"/>
      <stop offset="55%" stop-color="#0A266E"/>
      <stop offset="100%" stop-color="#113896"/>
    </linearGradient>
    <linearGradient id="bgCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B68"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgNavy)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="420" cy="240" r="260" fill="url(#glowGold)"/>
  <circle cx="720" cy="70" r="140" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="80" cy="440" r="180" fill="#FFFFFF" fill-opacity="0.03"/>
  
    <!-- Trajectory Arc -->
    <path d="M 110 370 Q 340 120 690 150" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle cx="110" cy="370" r="10" fill="#FFFFFF"/>
    <circle cx="380" cy="200" r="10" fill="url(#goldGrad)"/>
    <circle cx="690" cy="150" r="14" fill="url(#redGrad)" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Grand Compass Rose Centerpiece -->
    <g transform="translate(400, 250)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="115" fill="url(#glassCard)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
      <circle cx="0" cy="0" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 6"/>
      <polygon points="0,-82 18,-18 82,0 18,18 0,82 -18,18 -82,0 -18,-18" fill="url(#goldGrad)" opacity="0.9"/>
      <polygon points="0,-82 18,-18 0,0" fill="#FEF3C7"/>
      <polygon points="0,82 -18,18 0,0" fill="#EF4444"/>
      <circle cx="0" cy="0" r="14" fill="#071B68" stroke="#FFFFFF" stroke-width="3"/>
    </g>
    <!-- Floating Profile Card -->
    <g transform="translate(520, 270)" filter="url(#shadow)">
      <rect width="210" height="110" rx="18" fill="#FFFFFF" fill-opacity="0.95"/>
      <rect x="18" y="20" width="44" height="44" rx="12" fill="#071B68"/>
      <path d="M 30 42 L 40 32 L 50 42 L 40 52 Z" fill="#F59E0B"/>
      <rect x="76" y="24" width="110" height="10" rx="5" fill="#071B68"/>
      <rect x="76" y="44" width="80" height="8" rx="4" fill="#94A3B8"/>
      <rect x="18" y="78" width="174" height="14" rx="7" fill="#FEE2E2"/>
      <rect x="18" y="78" width="132" height="14" rx="7" fill="url(#redGrad)"/>
    </g>
    
  <!-- Subtle Corner Crest -->
  <g transform="translate(36, 32)">
    <rect width="128" height="32" rx="16" fill="#020617" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <circle cx="18" cy="16" r="6" fill="url(#redGrad)"/>
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">SERVICE 01</text>
  </g>
  <g transform="translate(36, 444)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" fill-opacity="0.75" letter-spacing="2.5">IQ OVERSEAS • CAREER COUNSELLING</text>
  </g>
</svg>
