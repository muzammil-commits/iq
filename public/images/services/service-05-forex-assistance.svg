<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">

  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05134A"/>
      <stop offset="55%" stop-color="#0A266E"/>
      <stop offset="100%" stop-color="#113896"/>
    </linearGradient>
    <linearGradient id="bgCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B68"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgNavy)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="420" cy="240" r="260" fill="url(#glowGold)"/>
  <circle cx="720" cy="70" r="140" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="80" cy="440" r="180" fill="#FFFFFF" fill-opacity="0.03"/>
  
    <!-- Floating Currency Badges -->
    <g filter="url(#shadow)">
      <circle cx="170" cy="145" r="42" fill="url(#glassCard)" stroke="#FDE68A" stroke-width="2"/>
      <text x="170" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#FDE68A">$</text>
      <circle cx="640" cy="145" r="42" fill="url(#glassCard)" stroke="#93C5FD" stroke-width="2"/>
      <text x="640" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#93C5FD">£</text>
      <circle cx="620" cy="365" r="42" fill="url(#glassCard)" stroke="#FCA5A5" stroke-width="2"/>
      <text x="620" y="379" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#FCA5A5">€</text>
    </g>
    <!-- Luxury Multi-Currency Student Forex Card -->
    <g transform="translate(215, 135) rotate(-4)" filter="url(#shadow)">
      <rect width="380" height="230" rx="24" fill="url(#bgCrimson)" stroke="url(#goldGrad)" stroke-width="3"/>
      <rect x="32" y="74" width="54" height="40" rx="8" fill="url(#goldGrad)"/>
      <line x1="32" y1="94" x2="86" y2="94" stroke="#92400E" stroke-width="2"/>
      <line x1="59" y1="74" x2="59" y2="114" stroke="#92400E" stroke-width="2"/>
      <text x="32" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="2">IQ GLOBAL FOREX</text>
      <text x="275" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FDE68A">0% MARKUP</text>
      <text x="32" y="162" font-family="monospace" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="3">4582  ••••  ••••  9026</text>
      <text x="32" y="198" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1">STUDENT MULTI-CURRENCY CARD</text>
    </g>
    
  <!-- Subtle Corner Crest -->
  <g transform="translate(36, 32)">
    <rect width="128" height="32" rx="16" fill="#020617" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <circle cx="18" cy="16" r="6" fill="url(#redGrad)"/>
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">SERVICE 05</text>
  </g>
  <g transform="translate(36, 444)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" fill-opacity="0.75" letter-spacing="2.5">IQ OVERSEAS • FOREX ASSISTANCE</text>
  </g>
</svg>
