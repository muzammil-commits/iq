<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">

  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05134A"/>
      <stop offset="55%" stop-color="#0A266E"/>
      <stop offset="100%" stop-color="#113896"/>
    </linearGradient>
    <linearGradient id="bgCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B68"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgCrimson)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="240" r="260" fill="url(#glowGold)"/>
  <circle cx="720" cy="70" r="140" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="80" cy="440" r="180" fill="#FFFFFF" fill-opacity="0.03"/>
  
    <!-- Official Passport -->
    <g transform="translate(190, 95)" filter="url(#shadow)">
      <rect width="230" height="305" rx="20" fill="#071B68" stroke="url(#goldGrad)" stroke-width="3"/>
      <text x="115" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#FDE68A" letter-spacing="3">PASSPORT</text>
      <circle cx="115" cy="145" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
      <ellipse cx="115" cy="145" rx="22" ry="46" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <line x1="69" y1="145" x2="161" y2="145" stroke="url(#goldGrad)" stroke-width="2"/>
      <text x="115" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="2">F-1 • UK • CA • AU</text>
    </g>
    <!-- Visa Approved Stamp Card -->
    <g transform="translate(385, 165) rotate(-8)" filter="url(#shadow)">
      <rect width="275" height="165" rx="18" fill="#FFFFFF"/>
      <rect x="16" y="16" width="243" height="133" rx="12" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="8 4"/>
      <text x="137" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#059669" letter-spacing="2">STUDY VISA</text>
      <text x="137" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#071B68" letter-spacing="3">APPROVED ✓</text>
    </g>
    
  <!-- Subtle Corner Crest -->
  <g transform="translate(36, 32)">
    <rect width="128" height="32" rx="16" fill="#020617" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <circle cx="18" cy="16" r="6" fill="url(#redGrad)"/>
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">SERVICE 10</text>
  </g>
  <g transform="translate(36, 444)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" fill-opacity="0.75" letter-spacing="2.5">IQ OVERSEAS • STUDY VISA</text>
  </g>
</svg>
