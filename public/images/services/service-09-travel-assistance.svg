<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">

  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05134A"/>
      <stop offset="55%" stop-color="#0A266E"/>
      <stop offset="100%" stop-color="#113896"/>
    </linearGradient>
    <linearGradient id="bgCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B68"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgNavy)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="240" r="260" fill="url(#glowRed)"/>
  <circle cx="720" cy="70" r="140" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="80" cy="440" r="180" fill="#FFFFFF" fill-opacity="0.03"/>
  
    <!-- Travel Suitcase -->
    <g transform="translate(185, 115)" filter="url(#shadow)">
      <rect x="65" y="-26" width="80" height="36" rx="10" fill="none" stroke="#CBD5E1" stroke-width="8"/>
      <rect width="210" height="265" rx="28" fill="url(#redGrad)" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="35" y="34" width="140" height="195" rx="16" fill="#991B1B" fill-opacity="0.45"/>
      <line x1="70" y1="34" x2="70" y2="229" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>
      <line x1="140" y1="34" x2="140" y2="229" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>
      <circle cx="38" cy="278" r="12" fill="#0F172A"/>
      <circle cx="172" cy="278" r="12" fill="#0F172A"/>
    </g>
    <!-- Travel Insurance & SIM Cards -->
    <g transform="translate(445, 130)" filter="url(#shadow)">
      <rect width="230" height="105" rx="18" fill="#FFFFFF"/>
      <circle cx="48" cy="52" r="26" fill="url(#emeraldGrad)"/>
      <path d="M 48 38 L 48 66 M 34 52 L 62 52" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <text x="90" y="48" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#071B68">TRAVEL COVER</text>
      <text x="90" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">Medical &amp; Transit Care</text>
    </g>
    <g transform="translate(445, 255)" filter="url(#shadow)">
      <rect width="230" height="105" rx="18" fill="#FFFFFF"/>
      <rect x="26" y="24" width="44" height="58" rx="8" fill="url(#goldGrad)"/>
      <text x="90" y="48" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#071B68">GLOBAL 5G SIM</text>
      <text x="90" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">Airport Pickup &amp; Data</text>
    </g>
    
  <!-- Subtle Corner Crest -->
  <g transform="translate(36, 32)">
    <rect width="128" height="32" rx="16" fill="#020617" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <circle cx="18" cy="16" r="6" fill="url(#redGrad)"/>
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">SERVICE 09</text>
  </g>
  <g transform="translate(36, 444)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" fill-opacity="0.75" letter-spacing="2.5">IQ OVERSEAS • TRAVEL ASSISTANCE</text>
  </g>
</svg>
